[project]
name = "pdi"
version = "0.1.0"
description = "Pré-processamento, segmentação e extração de características de lesões de pele"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "opencv-python-headless>=4.10",
    "pillow>=11.0",
    "scikit-image>=0.25",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"
