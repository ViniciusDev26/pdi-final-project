[project]
name = "training"
version = "0.1.0"
description = "Preparação de dados, treinamento e avaliação dos classificadores"
requires-python = ">=3.12"
dependencies = [
    "pdi",
    "ipykernel>=6.29",
    "matplotlib>=3.9",
    "pandas>=2.2",
    "scikit-learn>=1.6",
    "torch>=2.5",
    "torchvision>=0.20",
    "tqdm>=4.66",
]

[tool.uv.sources]
pdi = { workspace = true }

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"
