[project]
name = "api"
version = "0.1.0"
description = "API de inferência: recebe uma imagem dermatoscópica e retorna a classificação"
requires-python = ">=3.12"
dependencies = [
    "pdi",
    "fastapi>=0.115",
    "pillow>=11.0",
    "python-multipart>=0.0.20",
    "uvicorn[standard]>=0.32",
]

[tool.uv.sources]
pdi = { workspace = true }

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"
