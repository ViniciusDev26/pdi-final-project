name: pdi-melanoma

# Modo padrão (só CPU). Para o servidor de experimentos com GPU NVIDIA, use também o
# override: just up-gpu (docker compose -f docker-compose.yml -f docker-compose.gpu.yml).
services:
  api:
    build:
      context: ..
      dockerfile: infra/python.Dockerfile
      args:
        APP: api
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    # arquivos gravados em results/ e experiments/ ficam com o usuário do host
    user: "${PDI_UID:-1000}:${PDI_GID:-1000}"
    ports:
      - "8000:8000"
    volumes:
      - ../data:/app/data:ro
      - ../models:/app/models
      - ../results:/app/results
      - ../experiments:/app/experiments
    environment:
      PDI_MODELS_DIR: /app/models
      PDI_GIT_COMMIT: ${PDI_GIT_COMMIT:-desconhecido}
      HOME: /tmp
      TORCH_HOME: /app/results/_cache/torch
      MPLCONFIGDIR: /tmp/matplotlib
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: ..
      dockerfile: infra/python.Dockerfile
      args:
        APP: web
    command: >
      streamlit run apps/web/src/web/app.py
      --server.address 0.0.0.0 --server.port 8501 --server.headless true
    ports:
      - "8501:8501"
    environment:
      PDI_API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
