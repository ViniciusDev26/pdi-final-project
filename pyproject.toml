[tool.uv.workspace]
members = ["apps/api", "apps/training", "apps/web", "packages/pdi"]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=8.3",
    "ruff>=0.12",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["api", "pdi", "training", "web"]

[tool.pytest.ini_options]
testpaths = ["packages/pdi/tests", "apps/api/tests", "apps/training/tests", "apps/web/tests"]
